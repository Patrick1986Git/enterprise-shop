name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven verify
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw -B clean verify

      - name: Upload OpenAPI docs
        uses: actions/upload-artifact@v7
        with:
          name: openapi-docs
          path: target/generated-docs/openapi/**
          if-no-files-found: error

      - name: Upload static API docs site
        uses: actions/upload-artifact@v7
        with:
          name: api-docs-site
          path: target/generated-docs/site/**
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore

  docker-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build PostgreSQL image
        run: docker compose build postgres

      - name: Build application image
        run: docker compose build app

      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Bootstrap runtime database role
        run: docker compose up --wait --force-recreate database-role-bootstrap

      - name: Re-run runtime database role bootstrap
        run: docker compose up --wait --force-recreate database-role-bootstrap

      - name: Verify runtime database role attributes
        run: |
          docker compose exec -T postgres psql \
            -U "${POSTGRES_USER:-postgres}" \
            -d "${POSTGRES_DB:-enterprise_shop_dev}" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT rolname, rolsuper, rolcreatedb, rolcreaterole, rolreplication FROM pg_roles WHERE rolname = '${APP_DB_USER:-shop_dev}';"
          docker compose exec -T postgres psql \
            -U "${POSTGRES_USER:-postgres}" \
            -d "${POSTGRES_DB:-enterprise_shop_dev}" \
            -v ON_ERROR_STOP=1 \
            -tAc "SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${APP_DB_USER:-shop_dev}' AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolreplication) THEN 'ok' ELSE 'invalid' END;" | grep -qx ok

      - name: Start full Compose stack
        run: docker compose --profile full up -d --build --wait

      - name: Verify application health endpoint
        run: curl --fail --show-error http://127.0.0.1:8080/actuator/health

      - name: Collect PostgreSQL logs on failure
        if: failure()
        run: docker compose logs postgres

      - name: Collect bootstrap logs on failure
        if: failure()
        run: docker compose logs database-role-bootstrap

      - name: Collect app logs on failure
        if: failure()
        run: docker compose --profile full logs app

      - name: Shut down Compose stack
        if: always()
        run: docker compose --profile full down --volumes --remove-orphans

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download static API docs site
        uses: actions/download-artifact@v8
        with:
          name: api-docs-site
          path: target/generated-docs/site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/generated-docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
