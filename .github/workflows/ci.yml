name: CI

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout exact protected-base source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: target/dependency-review-base
          persist-credentials: false

      - name: Validate dependency-review provenance
        env:
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$BASE_REPOSITORY" = "${{ github.repository }}"
          test "$(git -C target/dependency-review-base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
          show-openssf-scorecard: false

  trivy-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'master' || github.event.pull_request.head.sha || github.ref }}

      - name: Verify original upstream Trivy executable provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify-trivy-provenance.py --upstream-only

      - name: Collect independent Trivy candidate build evidence
        run: python scripts/build-trivy-candidate.py --directory .tmp/trivy-candidate

      - name: Collect isolated Trivy candidate functional compatibility
        run: python scripts/verify-trivy-candidate-compatibility.py --build .tmp/trivy-candidate

      - name: Verify complete rebuilt Trivy trust contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify-trivy-provenance.py --build .tmp/trivy-candidate

      - name: Upload Trivy candidate collection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-candidate-collection
          path: |
            .tmp/trivy-candidate/**
            !.tmp/trivy-candidate/cache-*/**
            !.tmp/trivy-candidate/source/**
            !.tmp/trivy-candidate/trivy.*
            !.tmp/trivy-candidate/govulncheck
            !.tmp/trivy-candidate/image.tar
            !.tmp/trivy-candidate/layer.tar
            !.tmp/trivy-candidate/upstream.tar.gz
            !.tmp/trivy-candidate/sdk.tar.gz
            !.tmp/trivy-candidate/transport/**
            .tmp/container-security/auxiliary/scanner-provenance/**
            .tmp/trivy-compatibility/**
            !.tmp/trivy-compatibility/inputs/**
            !.tmp/trivy-compatibility/cache/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload candidate payload 00
        if: always() && hashFiles('.tmp/trivy-candidate/transport/00') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-candidate-payload-00
          path: .tmp/trivy-candidate/transport/00
          if-no-files-found: error
          retention-days: 14

      - name: Upload candidate payload 01
        if: always() && hashFiles('.tmp/trivy-candidate/transport/01') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-candidate-payload-01
          path: .tmp/trivy-candidate/transport/01
          if-no-files-found: error
          retention-days: 14

      - name: Upload candidate payload 02
        if: always() && hashFiles('.tmp/trivy-candidate/transport/02') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-candidate-payload-02
          path: .tmp/trivy-candidate/transport/02
          if-no-files-found: error
          retention-days: 14

      - name: Upload candidate payload 03
        if: always() && hashFiles('.tmp/trivy-candidate/transport/03') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-candidate-payload-03
          path: .tmp/trivy-candidate/transport/03
          if-no-files-found: error
          retention-days: 14

      - name: Upload candidate payload 04
        if: always() && hashFiles('.tmp/trivy-candidate/transport/04') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-candidate-payload-04
          path: .tmp/trivy-candidate/transport/04
          if-no-files-found: error
          retention-days: 14

      - name: Upload candidate payload 05
        if: always() && hashFiles('.tmp/trivy-candidate/transport/05') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-candidate-payload-05
          path: .tmp/trivy-candidate/transport/05
          if-no-files-found: error
          retention-days: 14

      - name: Upload candidate payload 06
        if: always() && hashFiles('.tmp/trivy-candidate/transport/06') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-candidate-payload-06
          path: .tmp/trivy-candidate/transport/06
          if-no-files-found: error
          retention-days: 14

      - name: Upload candidate payload 07
        if: always() && hashFiles('.tmp/trivy-candidate/transport/07') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-candidate-payload-07
          path: .tmp/trivy-candidate/transport/07
          if-no-files-found: error
          retention-days: 14

      - name: Upload candidate payload 08
        if: always() && hashFiles('.tmp/trivy-candidate/transport/08') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-candidate-payload-08
          path: .tmp/trivy-candidate/transport/08
          if-no-files-found: error
          retention-days: 14

      - name: Upload candidate payload 09
        if: always() && hashFiles('.tmp/trivy-candidate/transport/09') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-candidate-payload-09
          path: .tmp/trivy-candidate/transport/09
          if-no-files-found: error
          retention-days: 14

      - name: Upload candidate payload 10
        if: always() && hashFiles('.tmp/trivy-candidate/transport/10') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-candidate-payload-10
          path: .tmp/trivy-candidate/transport/10
          if-no-files-found: error
          retention-days: 14

      - name: Upload candidate payload 11
        if: always() && hashFiles('.tmp/trivy-candidate/transport/11') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-candidate-payload-11
          path: .tmp/trivy-candidate/transport/11
          if-no-files-found: error
          retention-days: 14

  build:
    needs: trivy-candidate
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'master' || github.event.pull_request.head.sha || github.ref }}

      - name: Download same-run verified Trivy evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: trivy-candidate-*
          path: .tmp/trivy-downloads

      - name: Verify and load current-HEAD Trivy executable
        run: python scripts/load-trivy-candidate.py

      - name: Validate live protected-master policy
        run: python scripts/validate-master-protection.py --repository "${{ github.repository }}"

      - name: Test CI policy tooling
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Validate GitHub Actions policy
        run: python scripts/validate-github-actions-policy.py

      - name: Validate Maven Wrapper integrity policy
        run: python scripts/validate-maven-wrapper.py

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build reviewed unpublished Ryuk candidate
        run: python scripts/build-ryuk-candidate.py

      - name: Run Maven verify
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          SPRING_PROFILES_ACTIVE: test
        run: |
          set -euo pipefail
          evidence="${PWD}/.tmp/build-tool-security"
          mkdir -p "${evidence}"
          ./mvnw -v > "${evidence}/maven-version.txt"
          python scripts/build-tool-inventory.py prepare
          ./mvnw -B -X \
            -Dmaven.ext.class.path="${evidence}/collector.jar" \
            -Dbuildtools.evidence="${evidence}/verify.tsv" -Dbuildtools.mode=verify \
            clean verify > "${evidence}/verify.log" 2>&1 || {
              tail -n 80 "${evidence}/verify.log"
              exit 1
            }
          tail -n 12 "${evidence}/verify.log"
          python scripts/check-ryuk-cleanup.py
          # Observe Docker's dependency:go-offline and any newly required Maven goal.
          python scripts/build-tool-inventory.py observe-commands || {
              tail -n 80 "${evidence}/docker.log"
              exit 1
            }

      - name: Upload Ryuk compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ryuk-compatibility-evidence
          path: |
            target/ryuk-compatibility/**
            .tmp/ryuk-compatibility/**
            .tmp/ryuk-candidate/build-receipt.json
            target/failsafe-reports/TEST-*RyukExecutionIT.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Checkout protected-master OpenAPI baseline source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: target/openapi-baseline-source
          persist-credentials: false

      - name: Generate protected-master OpenAPI baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SPRING_PROFILES_ACTIVE: test
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.repo.full_name }}" = "${{ github.repository }}"
          test "$(git -C target/openapi-baseline-source rev-parse HEAD)" = "$BASE_SHA"
          ./target/openapi-baseline-source/mvnw -B -f target/openapi-baseline-source/pom.xml \
            -Dtest=OpenApiDocsSmokeTest test
          printf '{"repository":"%s","sha":"%s"}\n' "${{ github.repository }}" "$BASE_SHA" \
            > target/openapi-baseline-source/target/generated-docs/openapi/baseline-provenance.json

      - name: Enforce Flyway rolling-compatibility decision boundary
        if: github.event_name == 'pull_request'
        env:
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$BASE_REPOSITORY" = "${{ github.repository }}"
          test "$(git -C target/openapi-baseline-source rev-parse HEAD)" = "$BASE_SHA"
          python scripts/validate_migration_compatibility.py \
            --base target/openapi-baseline-source \
            --candidate .

      - name: Enforce OpenAPI backward compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python scripts/openapi_compatibility.py \
            --baseline target/openapi-baseline-source/target/generated-docs/openapi \
            --candidate target/generated-docs/openapi \
            --baseline-sha "$BASE_SHA"

      - name: Validate JaCoCo report and summarize baseline
        run: python scripts/validate-jacoco-report.py --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-coverage-report
          path: |
            target/site/jacoco/index.html
            target/site/jacoco/jacoco.xml
            target/site/jacoco/jacoco.csv
          if-no-files-found: error
          retention-days: 14

      - name: Enforce JaCoCo coverage non-regression policy
        run: python scripts/validate-jacoco-report.py --policy .github/coverage/jacoco-baseline.json

      - name: Upload OpenAPI docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-docs
          path: target/generated-docs/openapi/**
          if-no-files-found: error

      - name: Upload static API docs site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-docs-site
          path: target/generated-docs/site/**
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore

      - name: Generate and validate reviewed build-tool CycloneDX
        run: |
          set -euo pipefail
          python scripts/build-tool-inventory.py collect
          python scripts/build-tool-inventory.py validate-bom

      - name: Cache existing Trivy database for build-tool scanning
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/container-security/trivy-cache
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}-build-tools
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Enforce build-tool HIGH and CRITICAL advisory policy
        run: python scripts/scan-build-tools.py

      - name: Upload build-tool security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-tool-security-evidence
          path: .tmp/build-tool-security/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  docker-validation:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate development script syntax
        run: sh -n scripts/run-dev.sh

      - name: Lint development script when ShellCheck is available
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/run-dev.sh
          else
            echo "ShellCheck is not installed; skipping shellcheck lint."
          fi

      - name: Validate dotenv safety checks
        run: |
          trap 'rm -f .env' EXIT
          cat > .env <<'EOF'
          BAD-NAME=value
          EOF
          if ./scripts/run-dev.sh --prepare-only; then
            echo "Expected invalid .env variable name to fail" >&2
            exit 1
          fi

          cat > .env <<'EOF'
          APP_DB_PASSWORD=$(echo unsafe)
          EOF
          if ./scripts/run-dev.sh --prepare-only; then
            echo "Expected .env command substitution to fail" >&2
            exit 1
          fi

          cat > .env <<'EOF'
          APP_DB_PASSWORD="unterminated
          EOF
          if ./scripts/run-dev.sh --prepare-only; then
            echo "Expected unterminated double-quoted .env value to fail" >&2
            exit 1
          fi

          cat > .env <<'EOF'
          APP_DB_PASSWORD='unterminated
          EOF
          if ./scripts/run-dev.sh --prepare-only; then
            echo "Expected unterminated single-quoted .env value to fail" >&2
            exit 1
          fi

          cat > .env <<'EOF'
          DATABASE_USERNAME=postgres
          EOF
          if ./scripts/run-dev.sh --prepare-only; then
            echo "Expected conflicting runtime/admin datasource user to fail" >&2
            exit 1
          fi

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build PostgreSQL image
        run: docker compose build postgres

      - name: Build bootstrap image
        run: docker compose build database-role-bootstrap

      - name: Prepare fresh local database with run-dev
        run: ./scripts/run-dev.sh --prepare-only

      - name: Verify runtime database role attributes
        run: |
          docker compose exec -T postgres psql \
            -U "${POSTGRES_USER:-postgres}" \
            -d "${POSTGRES_DB:-enterprise_shop_dev}" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT rolname, rolcanlogin, rolsuper, rolcreatedb, rolcreaterole, rolreplication FROM pg_roles WHERE rolname = '${APP_DB_USER:-shop_dev}';"
          docker compose exec -T postgres psql \
            -U "${POSTGRES_USER:-postgres}" \
            -d "${POSTGRES_DB:-enterprise_shop_dev}" \
            -v ON_ERROR_STOP=1 \
            -tAc "SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${APP_DB_USER:-shop_dev}' AND rolcanlogin AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolreplication) THEN 'ok' ELSE 'invalid' END;" | grep -qx ok

      - name: Re-run prepare-only without unnecessary bootstrap
        run: |
          ./scripts/run-dev.sh --prepare-only | tee /tmp/run-dev-idempotent.log
          grep -q "bootstrap is not needed" /tmp/run-dev-idempotent.log

      - name: Verify changed APP_DB_PASSWORD is repaired
        run: |
          APP_DB_PASSWORD=shop_dev_changed ./scripts/run-dev.sh --prepare-only
          docker compose exec -T \
            -e PGPASSWORD=shop_dev_changed \
            postgres psql \
              --host 127.0.0.1 \
              --port 5432 \
              --username "${APP_DB_USER:-shop_dev}" \
              --dbname "${POSTGRES_DB:-enterprise_shop_dev}" \
              -v ON_ERROR_STOP=1 \
              -tAc "SELECT current_user;" | grep -qx "${APP_DB_USER:-shop_dev}"

      - name: Verify excessive role attributes are repaired
        run: |
          docker compose exec -T postgres psql \
            -U "${POSTGRES_USER:-postgres}" \
            -d "${POSTGRES_DB:-enterprise_shop_dev}" \
            -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE \"${APP_DB_USER:-shop_dev}\" CREATEDB;"
          ./scripts/run-dev.sh --prepare-only
          docker compose exec -T postgres psql \
            -U "${POSTGRES_USER:-postgres}" \
            -d "${POSTGRES_DB:-enterprise_shop_dev}" \
            -v ON_ERROR_STOP=1 \
            -tAc "SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${APP_DB_USER:-shop_dev}' AND rolcanlogin AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolreplication) THEN 'ok' ELSE 'invalid' END;" | grep -qx ok

      - name: Build application image
        run: docker compose build app

      - name: Start full Compose stack
        run: docker compose --profile full up -d --build --wait

      - name: Verify application health endpoint
        run: curl --fail --show-error http://127.0.0.1:8080/actuator/health

      - name: Verify runtime append-only evidence integrity
        run: ./scripts/verify-runtime-append-only-integrity.sh

      - name: Collect Compose status on failure
        if: failure()
        run: docker compose --profile full ps -a

      - name: Collect PostgreSQL logs on failure
        if: failure()
        run: docker compose logs postgres

      - name: Collect app logs on failure
        if: failure()
        run: docker compose --profile full logs app

      - name: Shut down Compose stack
        if: always()
        run: docker compose --profile full down --volumes --remove-orphans

  restore-pr-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_restore: ${{ steps.scope.outputs.run_restore }}

    steps:
      - name: Checkout candidate source for restore scope detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Determine whether the PR affects restore execution
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/restore_pr_scope.py \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

  restore-rehearsal:
    needs: restore-pr-scope
    if: >-
      always() &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && needs.restore-pr-scope.outputs.run_restore == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout restore rehearsal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'master' || github.event_name == 'pull_request' && github.sha || github.ref }}

      - name: Validate restore rehearsal script syntax
        run: |
          bash -n scripts/restore-rehearsal.sh
          bash -n scripts/historical-forward-restore-rehearsal.sh

      - name: Run synthetic PostgreSQL logical restore rehearsal
        run: ./scripts/restore-rehearsal.sh

      - name: Run historical-forward PostgreSQL restore rehearsal
        run: ./scripts/historical-forward-restore-rehearsal.sh

  container-security:
    needs: trivy-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Same reviewed Hadolint executable in the upstream scratch variant; removes vulnerable Alpine packages.
      HADOLINT_IMAGE: docker.io/hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e
      # Verified upstream 0.75.0 source rebuilt twice with Go 1.27.2 and x/net v0.60.0; immutable local configuration digest.
      TRIVY_IMAGE: local/enterprise-shop-trivy:sha256-6f88ec766c6db9ca32e417aa9a4bf494d0450f5b4bcc7e94971a5e51e9fd737c
      # Supported patched analysis toolchain; gosu applicability remains bound to the installed binary Go version.
      GOSU_GOVULNCHECK_IMAGE: docker.io/library/golang:1.26.9-alpine3.24@sha256:cdfd4fe2da6b225d8b40c6b7a105736e548e83ff56d5d8f9394446eeb5eb84e0
      # Official Docker Hub Alpine 3.20 multi-platform OCI index.
      TRIVY_POLICY_TEST_IMAGE: docker.io/library/alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
      RYUK_IMAGE: local/enterprise-shop-ryuk:sha256-0c88a43b0dbf5f47247aae36c687e69bda0ec11d49d198f3e2f7a77932a44e2a
      # Human-readable gosu release tag; CI verifies that it resolves to the pinned immutable commit before govulncheck.
      GOSU_SOURCE_TAG: "1.19"
      GOSU_SOURCE_COMMIT: 6456aaa0f3c854d199d0f037f068eb97515b7513

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'master' || github.event.pull_request.head.sha || github.ref }}

      - name: Download same-run verified Trivy evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: trivy-candidate-*
          path: .tmp/trivy-downloads

      - name: Verify and load current-HEAD Trivy executable
        run: python scripts/load-trivy-candidate.py

      - name: Prove unpublished Ryuk candidate build
        run: python scripts/build-ryuk-candidate.py

      - name: Upload unpublished Ryuk candidate proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ryuk-candidate-build-proof
          path: |
            .tmp/ryuk-candidate/**
            !.tmp/ryuk-candidate/image.tar
            !.tmp/ryuk-candidate/layer.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Validate auxiliary container inventory
        run: |
          python scripts/validate-auxiliary-containers.py inventory
          python -m unittest discover -s scripts/tests -p 'test_auxiliary_containers.py'
          python -m unittest discover -s scripts/tests -p 'test_auxiliary_compressed_go.py'
          python -m unittest discover -s scripts/tests -p 'test_ryuk_candidate*.py'

      - name: Validate pinned container tool references
        run: |
          set -euo pipefail

          validate_linux_amd64_image() {
            local image="$1"

            echo "Validating ${image}"
            docker buildx imagetools inspect "${image}" >/dev/null
            docker pull --platform linux/amd64 "${image}"

            local platform
            platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${image}")"
            if [ "${platform}" != "linux/amd64" ]; then
              echo "Expected linux/amd64 but resolved ${platform} for ${image}" >&2
              exit 1
            fi
          }

          validate_linux_amd64_image "${HADOLINT_IMAGE}"
          docker image inspect "${TRIVY_IMAGE}" >/dev/null
          validate_linux_amd64_image "${GOSU_GOVULNCHECK_IMAGE}"
          validate_linux_amd64_image "docker.io/library/golang:1.27.2-alpine3.24@sha256:85dc1069ac644ea3c527b177303a406eb3358192816cd7f9e5848eb658851673"
          validate_linux_amd64_image "${TRIVY_POLICY_TEST_IMAGE}"
          docker image inspect "${RYUK_IMAGE}" >/dev/null
          validate_linux_amd64_image "docker.io/testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0"

          docker run --rm --platform linux/amd64 "${HADOLINT_IMAGE}" hadolint --version | grep -F '2.14.0'
          docker run --rm --platform linux/amd64 "${TRIVY_IMAGE}" version | grep -F 'Version: 0.75.0'
          docker run --rm --platform linux/amd64 "${GOSU_GOVULNCHECK_IMAGE}" go version | grep -F 'go1.26.9 linux/amd64'
          docker run --rm --platform linux/amd64 "${TRIVY_POLICY_TEST_IMAGE}" cat /etc/alpine-release | grep -E '^3\.20\.'

      - name: Verify upstream Trivy executable provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify-trivy-provenance.py

      - name: Lint Dockerfiles with Hadolint
        run: |
          docker run --rm --platform linux/amd64 --network none \
            -v "${PWD}:/workspace:ro" \
            -w /workspace \
            "${HADOLINT_IMAGE}" \
            hadolint --ignore DL3008 Dockerfile docker/postgres/Dockerfile

      - name: Cache Trivy database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/container-security/trivy-cache
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Validate Trivy policy configuration
        run: |
          mkdir -p .tmp/container-security/trivy-cache
          ruby -r yaml -r time -e '
            entries = YAML.load_file(".trivyignore.yaml").fetch("vulnerabilities")
            abort "expected one exact vulnerability exception" unless entries.length == 1
            exception = entries.first
            abort "unexpected exception ID" unless exception["id"] == "CVE-2025-68121"
            abort "unexpected exception path" unless exception["paths"] == ["usr/local/bin/gosu"]
            abort "missing exception statement" unless exception["statement"].is_a?(String) && !exception["statement"].strip.empty?
            value = exception["expired_at"]
            abort "expired_at must be RFC 3339" unless value.is_a?(String) && Time.iso8601(value).iso8601 == value
          '
          docker run --rm \
            -v "${PWD}/.trivyignore.yaml:/workspace/.trivyignore.yaml:ro" \
            -v "${PWD}/.tmp/container-security/trivy-cache:/root/.cache/trivy" \
            -w /workspace \
            "${TRIVY_IMAGE}" image --scanners vuln --severity CRITICAL --exit-code 0 --format table --ignorefile .trivyignore.yaml "${TRIVY_POLICY_TEST_IMAGE}"

      - name: Validate reviewed builder boundary
        run: |
          python scripts/validate-builder-security.py stages
          python -m unittest discover -s scripts/tests -p 'test_builder_security.py'

      - name: Build CI-local images from fresh bases
        env:
          BUILDX_METADATA_PROVENANCE: max
        run: |
          mkdir -p .tmp/container-security/builder
          docker buildx build --pull --platform linux/amd64 --target builder --load --tag enterprise-shop/builder:ci --metadata-file .tmp/container-security/builder/builder-build.json .
          docker buildx build --pull --platform linux/amd64 --load --tag enterprise-shop/app:ci --metadata-file .tmp/container-security/builder/app-build.json .
          docker build --pull --tag enterprise-shop/postgres:ci docker/postgres

      - name: Compare scanners on actual application PostgreSQL and builder images
        run: |
          python scripts/verify-trivy-candidate-compatibility.py \
            --build "${RUNNER_TEMP}/enterprise-shop-trivy" \
            --directory .tmp/trivy-actual-compatibility \
            --image enterprise-shop/app:ci --image enterprise-shop/postgres:ci --image enterprise-shop/builder:ci
          python -c "import json, subprocess, sys; from pathlib import Path; sys.path.insert(0, 'scripts'); import trivy_candidate_evidence as e; e.validate_compatibility(Path('.tmp/trivy-actual-compatibility'), json.loads(e.CONTRACT.read_text()), subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), actual_images=True)"

      - name: Upload actual image scanner compatibility
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-actual-image-compatibility
          path: |
            .tmp/trivy-actual-compatibility/**
            !.tmp/trivy-actual-compatibility/inputs/**
            !.tmp/trivy-actual-compatibility/cache/**
            !.tmp/trivy-actual-compatibility/temporary/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Record builder and runtime identities
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/record-docker-builder.sh

      - name: Generate builder raw vulnerability report and CycloneDX
        run: bash scripts/scan-docker-builder.sh

      - name: Retrieve Temurin JDK advisory evidence
        run: python scripts/validate-builder-security.py fetch-jdk

      - name: Upload builder security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-builder-security-evidence
          path: .tmp/container-security/builder/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Collect auxiliary image vulnerability and SBOM evidence
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/scan-auxiliary-containers.py

      - name: Verify application runtime Java version
        run: |
          java_properties="$(docker run --rm --entrypoint java enterprise-shop/app:ci -XshowSettings:properties -version 2>&1)"
          printf '%s\n' "${java_properties}"
          java_specification_version="$(printf '%s\n' "${java_properties}" | awk -F ' = ' '$1 ~ /^[[:space:]]*java\.specification\.version$/ { print $2 }')"
          if [ "${java_specification_version}" != "21" ]; then
            echo "Expected java.specification.version = 21, got: ${java_specification_version:-<missing>}" >&2
            exit 1
          fi
          echo "Verified java.specification.version = ${java_specification_version}"

      - name: Record PostgreSQL image metadata
        run: |
          docker image inspect enterprise-shop/postgres:ci --format '{{json .Id}} {{json .RepoTags}} {{json .RepoDigests}} {{json .Created}}'
          docker run --rm --entrypoint gosu enterprise-shop/postgres:ci --version

      - name: Prepare container security artifact directories
        run: mkdir -p .tmp/container-security/trivy-cache .tmp/container-security/reports .tmp/container-security/sbom

      - name: Generate raw vulnerability reports
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.tmp/container-security/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --format table enterprise-shop/app:ci
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.tmp/container-security/trivy-cache:/root/.cache/trivy" \
            -v "${PWD}/.tmp/container-security/reports:/reports" \
            "${TRIVY_IMAGE}" image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --format json --output /reports/enterprise-shop-app-trivy-raw.json enterprise-shop/app:ci
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.tmp/container-security/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --format table enterprise-shop/postgres:ci
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.tmp/container-security/trivy-cache:/root/.cache/trivy" \
            -v "${PWD}/.tmp/container-security/reports:/reports" \
            "${TRIVY_IMAGE}" image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --format json --output /reports/enterprise-shop-postgres-trivy-raw.json enterprise-shop/postgres:ci

      - name: Generate CycloneDX SBOMs
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.tmp/container-security/trivy-cache:/root/.cache/trivy" \
            -v "${PWD}/.tmp/container-security/sbom:/sbom" \
            "${TRIVY_IMAGE}" image --format cyclonedx --output /sbom/enterprise-shop-app.cdx.json enterprise-shop/app:ci
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.tmp/container-security/trivy-cache:/root/.cache/trivy" \
            -v "${PWD}/.tmp/container-security/sbom:/sbom" \
            "${TRIVY_IMAGE}" image --format cyclonedx --output /sbom/enterprise-shop-postgres.cdx.json enterprise-shop/postgres:ci
          python -m json.tool .tmp/container-security/sbom/enterprise-shop-app.cdx.json >/dev/null
          python -m json.tool .tmp/container-security/sbom/enterprise-shop-postgres.cdx.json >/dev/null
          grep -q 'enterprise-shop/app:ci' .tmp/container-security/sbom/enterprise-shop-app.cdx.json
          grep -q 'enterprise-shop/postgres:ci' .tmp/container-security/sbom/enterprise-shop-postgres.cdx.json

      - name: Upload vulnerability scan reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-vulnerability-reports
          path: .tmp/container-security/reports/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload application SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enterprise-shop-app-sbom
          path: .tmp/container-security/sbom/enterprise-shop-app.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload PostgreSQL SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enterprise-shop-postgres-sbom
          path: .tmp/container-security/sbom/enterprise-shop-postgres.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify gosu CVE applicability with upstream govulncheck
        run: |
          set -euo pipefail

          rm -rf .tmp/gosu-source
          git clone \
            --depth 1 \
            --branch "${GOSU_SOURCE_TAG}" \
            --single-branch \
            https://github.com/tianon/gosu.git \
            .tmp/gosu-source
          cd .tmp/gosu-source

          resolved_tag_commit="$(git rev-parse "refs/tags/${GOSU_SOURCE_TAG}^{commit}")"
          if [ "${resolved_tag_commit}" != "${GOSU_SOURCE_COMMIT}" ]; then
            echo "Expected gosu ${GOSU_SOURCE_TAG} to resolve to ${GOSU_SOURCE_COMMIT}, but resolved ${resolved_tag_commit}" >&2
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "${GOSU_SOURCE_COMMIT}" ]; then
            echo "Checked-out gosu commit does not match the pinned source commit" >&2
            exit 1
          fi

          test -x govulncheck-with-excludes.sh
          test -f version.go
          grep -F 'const Version = "1.19"' version.go

          cd ../..
          bash scripts/run-gosu-govulncheck.sh

      - name: Test component-aware vulnerability policy
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Validate raw reports against component-aware HIGH policy
        run: |
          python scripts/validate-container-vulnerability-policy.py application .tmp/container-security/reports/enterprise-shop-app-trivy-raw.json
          python scripts/validate-container-vulnerability-policy.py postgres .tmp/container-security/reports/enterprise-shop-postgres-trivy-raw.json

      - name: Enforce builder HIGH and CRITICAL vulnerability policy
        run: python scripts/validate-builder-security.py evidence

      - name: Upload builder policy decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-builder-policy-result
          path: .tmp/container-security/builder/policy-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce application HIGH and CRITICAL vulnerability policy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.tmp/container-security/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format table enterprise-shop/app:ci

      - name: Enforce PostgreSQL CRITICAL vulnerability policy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.tmp/container-security/trivy-cache:/root/.cache/trivy" \
            -v "${PWD}/.trivyignore.yaml:/workspace/.trivyignore.yaml:ro" \
            -w /workspace \
            "${TRIVY_IMAGE}" image --scanners vuln --severity CRITICAL --exit-code 1 --format table --ignorefile .trivyignore.yaml --show-suppressed enterprise-shop/postgres:ci

      - name: Upload auxiliary container evidence before policy
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auxiliary-container-evidence
          path: |
            .tmp/container-security/auxiliary/**
            !.tmp/container-security/auxiliary/scanner/source/**
            !.tmp/container-security/auxiliary/scanner/image.tar
            !.tmp/container-security/auxiliary/scanner/layer.tar
            !.tmp/container-security/auxiliary/scanner/trivy.*
            !.tmp/container-security/auxiliary/scanner/govulncheck
            !.tmp/container-security/auxiliary/scanner/upstream.tar.gz
            !.tmp/container-security/auxiliary/scanner/sdk.tar.gz
            !.tmp/container-security/auxiliary/ryuk/image.tar
            !.tmp/container-security/auxiliary/ryuk/layer.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload auxiliary Ryuk image payload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auxiliary-ryuk-image-payload
          path: |
            .tmp/container-security/auxiliary/ryuk/image.tar
            .tmp/container-security/auxiliary/ryuk/layer.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Enforce auxiliary HIGH and CRITICAL policy
        run: python scripts/validate-auxiliary-containers.py evidence

      - name: Upload auxiliary container policy decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auxiliary-container-policy-result
          path: |
            .tmp/container-security/auxiliary/policy-result.json
            .tmp/container-security/gosu/*.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download static API docs site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-docs-site
          path: target/generated-docs/site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/generated-docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
