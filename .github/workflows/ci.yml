name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven verify
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw -B clean verify

      - name: Upload OpenAPI docs
        uses: actions/upload-artifact@v7
        with:
          name: openapi-docs
          path: target/generated-docs/openapi/**
          if-no-files-found: error

      - name: Upload static API docs site
        uses: actions/upload-artifact@v7
        with:
          name: api-docs-site
          path: target/generated-docs/site/**
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore

  docker-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate development script syntax
        run: sh -n scripts/run-dev.sh

      - name: Lint development script when ShellCheck is available
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/run-dev.sh
          else
            echo "ShellCheck is not installed; skipping shellcheck lint."
          fi

      - name: Validate dotenv safety checks
        run: |
          trap 'rm -f .env' EXIT
          cat > .env <<'EOF'
          BAD-NAME=value
          EOF
          if ./scripts/run-dev.sh --prepare-only; then
            echo "Expected invalid .env variable name to fail" >&2
            exit 1
          fi

          cat > .env <<'EOF'
          APP_DB_PASSWORD=$(echo unsafe)
          EOF
          if ./scripts/run-dev.sh --prepare-only; then
            echo "Expected .env command substitution to fail" >&2
            exit 1
          fi

          cat > .env <<'EOF'
          APP_DB_PASSWORD="unterminated
          EOF
          if ./scripts/run-dev.sh --prepare-only; then
            echo "Expected unterminated double-quoted .env value to fail" >&2
            exit 1
          fi

          cat > .env <<'EOF'
          APP_DB_PASSWORD='unterminated
          EOF
          if ./scripts/run-dev.sh --prepare-only; then
            echo "Expected unterminated single-quoted .env value to fail" >&2
            exit 1
          fi

          cat > .env <<'EOF'
          DATABASE_USERNAME=postgres
          EOF
          if ./scripts/run-dev.sh --prepare-only; then
            echo "Expected conflicting runtime/admin datasource user to fail" >&2
            exit 1
          fi

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build PostgreSQL image
        run: docker compose build postgres

      - name: Build bootstrap image
        run: docker compose build database-role-bootstrap

      - name: Prepare fresh local database with run-dev
        run: ./scripts/run-dev.sh --prepare-only

      - name: Verify runtime database role attributes
        run: |
          docker compose exec -T postgres psql \
            -U "${POSTGRES_USER:-postgres}" \
            -d "${POSTGRES_DB:-enterprise_shop_dev}" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT rolname, rolcanlogin, rolsuper, rolcreatedb, rolcreaterole, rolreplication FROM pg_roles WHERE rolname = '${APP_DB_USER:-shop_dev}';"
          docker compose exec -T postgres psql \
            -U "${POSTGRES_USER:-postgres}" \
            -d "${POSTGRES_DB:-enterprise_shop_dev}" \
            -v ON_ERROR_STOP=1 \
            -tAc "SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${APP_DB_USER:-shop_dev}' AND rolcanlogin AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolreplication) THEN 'ok' ELSE 'invalid' END;" | grep -qx ok

      - name: Re-run prepare-only without unnecessary bootstrap
        run: |
          ./scripts/run-dev.sh --prepare-only | tee /tmp/run-dev-idempotent.log
          grep -q "bootstrap is not needed" /tmp/run-dev-idempotent.log

      - name: Verify changed APP_DB_PASSWORD is repaired
        run: |
          APP_DB_PASSWORD=shop_dev_changed ./scripts/run-dev.sh --prepare-only
          docker compose exec -T \
            -e PGPASSWORD=shop_dev_changed \
            postgres psql \
              --host 127.0.0.1 \
              --port 5432 \
              --username "${APP_DB_USER:-shop_dev}" \
              --dbname "${POSTGRES_DB:-enterprise_shop_dev}" \
              -v ON_ERROR_STOP=1 \
              -tAc "SELECT current_user;" | grep -qx "${APP_DB_USER:-shop_dev}"

      - name: Verify excessive role attributes are repaired
        run: |
          docker compose exec -T postgres psql \
            -U "${POSTGRES_USER:-postgres}" \
            -d "${POSTGRES_DB:-enterprise_shop_dev}" \
            -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE \"${APP_DB_USER:-shop_dev}\" CREATEDB;"
          ./scripts/run-dev.sh --prepare-only
          docker compose exec -T postgres psql \
            -U "${POSTGRES_USER:-postgres}" \
            -d "${POSTGRES_DB:-enterprise_shop_dev}" \
            -v ON_ERROR_STOP=1 \
            -tAc "SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${APP_DB_USER:-shop_dev}' AND rolcanlogin AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolreplication) THEN 'ok' ELSE 'invalid' END;" | grep -qx ok

      - name: Build application image
        run: docker compose build app

      - name: Start full Compose stack
        run: docker compose --profile full up -d --build --wait

      - name: Verify application health endpoint
        run: curl --fail --show-error http://127.0.0.1:8080/actuator/health

      - name: Collect Compose status on failure
        if: failure()
        run: docker compose --profile full ps -a

      - name: Collect PostgreSQL logs on failure
        if: failure()
        run: docker compose logs postgres

      - name: Collect app logs on failure
        if: failure()
        run: docker compose --profile full logs app

      - name: Shut down Compose stack
        if: always()
        run: docker compose --profile full down --volumes --remove-orphans

  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Hadolint v2.12.0.
      HADOLINT_IMAGE: hadolint/hadolint:v2.12.0-debian
      # Trivy v0.72.0, current stable release confirmed from aquasecurity/trivy releases; pinned to the GHCR 0.72.0 image digest.
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
      # gosu upstream govulncheck wrapper runs inside a pinned Go image, not golang:latest.
      GOSU_GOVULNCHECK_IMAGE: golang:1.25.7-bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Dockerfiles with Hadolint
        run: |
          docker run --rm \
            -v "${PWD}:/workspace:ro" \
            -w /workspace \
            "${HADOLINT_IMAGE}" \
            hadolint --ignore DL3008 Dockerfile docker/postgres/Dockerfile

      - name: Cache Trivy database
        uses: actions/cache@v4
        with:
          path: .tmp/container-security/trivy-cache
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Validate Trivy policy configuration
        run: |
          mkdir -p .tmp/container-security/trivy-cache
          docker run --rm \
            -v "${PWD}/.trivyignore.yaml:/workspace/.trivyignore.yaml:ro" \
            -v "${PWD}/.tmp/container-security/trivy-cache:/root/.cache/trivy" \
            -w /workspace \
            "${TRIVY_IMAGE}" image --scanners vuln --severity CRITICAL --exit-code 0 --format table --ignorefile .trivyignore.yaml alpine:3.20

      - name: Build CI-local images from fresh bases
        run: |
          docker build --pull --tag enterprise-shop/app:ci .
          docker build --pull --tag enterprise-shop/postgres:ci docker/postgres

      - name: Record PostgreSQL image metadata
        run: |
          docker image inspect enterprise-shop/postgres:ci --format '{{json .Id}} {{json .RepoTags}} {{json .RepoDigests}} {{json .Created}}'
          docker run --rm --entrypoint gosu enterprise-shop/postgres:ci --version

      - name: Verify gosu CVE applicability with upstream govulncheck
        run: |
          rm -rf .tmp/gosu-source
          git clone --depth 1 --branch 1.19 https://github.com/tianon/gosu.git .tmp/gosu-source
          cd .tmp/gosu-source
          GOLANG_IMAGE="${GOSU_GOVULNCHECK_IMAGE}" ./govulncheck-with-excludes.sh ./...

      - name: Prepare container security artifact directories
        run: mkdir -p .tmp/container-security/trivy-cache .tmp/container-security/reports .tmp/container-security/sbom

      - name: Generate raw vulnerability reports
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.tmp/container-security/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --format table enterprise-shop/app:ci
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.tmp/container-security/trivy-cache:/root/.cache/trivy" \
            -v "${PWD}/.tmp/container-security/reports:/reports" \
            "${TRIVY_IMAGE}" image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --format json --output /reports/enterprise-shop-app-trivy-raw.json enterprise-shop/app:ci
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.tmp/container-security/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --format table enterprise-shop/postgres:ci
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.tmp/container-security/trivy-cache:/root/.cache/trivy" \
            -v "${PWD}/.tmp/container-security/reports:/reports" \
            "${TRIVY_IMAGE}" image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --format json --output /reports/enterprise-shop-postgres-trivy-raw.json enterprise-shop/postgres:ci

      - name: Generate CycloneDX SBOMs
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.tmp/container-security/trivy-cache:/root/.cache/trivy" \
            -v "${PWD}/.tmp/container-security/sbom:/sbom" \
            "${TRIVY_IMAGE}" image --format cyclonedx --output /sbom/enterprise-shop-app.cdx.json enterprise-shop/app:ci
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.tmp/container-security/trivy-cache:/root/.cache/trivy" \
            -v "${PWD}/.tmp/container-security/sbom:/sbom" \
            "${TRIVY_IMAGE}" image --format cyclonedx --output /sbom/enterprise-shop-postgres.cdx.json enterprise-shop/postgres:ci
          python -m json.tool .tmp/container-security/sbom/enterprise-shop-app.cdx.json >/dev/null
          python -m json.tool .tmp/container-security/sbom/enterprise-shop-postgres.cdx.json >/dev/null
          grep -q 'enterprise-shop/app:ci' .tmp/container-security/sbom/enterprise-shop-app.cdx.json
          grep -q 'enterprise-shop/postgres:ci' .tmp/container-security/sbom/enterprise-shop-postgres.cdx.json

      - name: Upload vulnerability scan reports
        uses: actions/upload-artifact@v7
        with:
          name: container-vulnerability-reports
          path: .tmp/container-security/reports/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload application SBOM
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-shop-app-sbom
          path: .tmp/container-security/sbom/enterprise-shop-app.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload PostgreSQL SBOM
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-shop-postgres-sbom
          path: .tmp/container-security/sbom/enterprise-shop-postgres.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce application CRITICAL vulnerability policy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.tmp/container-security/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" image --scanners vuln --severity CRITICAL --exit-code 1 --format table enterprise-shop/app:ci

      - name: Enforce PostgreSQL CRITICAL vulnerability policy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/.tmp/container-security/trivy-cache:/root/.cache/trivy" \
            -v "${PWD}/.trivyignore.yaml:/workspace/.trivyignore.yaml:ro" \
            -w /workspace \
            "${TRIVY_IMAGE}" image --scanners vuln --severity CRITICAL --exit-code 1 --format table --ignorefile .trivyignore.yaml --show-suppressed enterprise-shop/postgres:ci

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download static API docs site
        uses: actions/download-artifact@v8
        with:
          name: api-docs-site
          path: target/generated-docs/site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/generated-docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
