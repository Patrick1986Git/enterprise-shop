name: November 24 Go Docker 29 qualification

on:
  push:
    branches: [evidence/go-nov24-docker29-6285a517]

permissions:
  contents: read

concurrency:
  group: go-nov24-docker29-6285a517
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      PYTHONDONTWRITEBYTECODE: '1'
      BUILDX_METADATA_PROVENANCE: max
    steps:
      - name: Checkout exact qualification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          path: harness

      - name: Checkout exact candidate source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 8663f7dfddaddd58d238727e7198538f8c651ecf
          persist-credentials: false
          path: candidate

      - name: Verify runner, official acquisition and terminal cgroup lifecycle
        timeout-minutes: 7
        run: >-
          python3 harness/.github/go-nov24-qualification/collect.py
          preflight candidate harness "$RUNNER_TEMP/nov24-go-evidence"

      - name: Verify existing Trivy upstream release and provenance authority
        timeout-minutes: 4
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-trivy-provenance.py --upstream-only

      - name: Collect independent Trivy construction and analyzer evidence
        timeout-minutes: 44
        run: >-
          python3 harness/.github/go-nov24-qualification/collect.py
          collect-trivy candidate harness "$RUNNER_TEMP/nov24-go-evidence"

      - name: Deactivate and remove only this job's temporary swap
        if: always()
        timeout-minutes: 2
        run: >-
          python3 harness/.github/go-nov24-qualification/runner_swap.py
          "$RUNNER_TEMP/nov24-go-evidence"

      - name: Bind retained evidence bytes and diagnostics
        if: always()
        timeout-minutes: 3
        run: >-
          python3 harness/.github/go-nov24-qualification/retain.py
          "$RUNNER_TEMP/nov24-go-evidence" candidate "$RUNNER_TEMP/nov24-go-retained"

      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-nov24-qualification-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/nov24-go-retained
          if-no-files-found: error
          retention-days: 14
