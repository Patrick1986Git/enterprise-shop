name: CodeQL

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: "37 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Java/Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'master' || github.event.pull_request.head.sha || github.ref }}

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build reviewed unpublished Ryuk candidate
        run: python scripts/build-ryuk-candidate.py

      - name: Build and test application
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw -B clean verify

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  analyze-python:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'master' || github.event.pull_request.head.sha || github.ref }}

      - name: Initialize Python CodeQL
        id: init-python
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
          build-mode: none
          queries: security-extended
          db-location: ${{ runner.temp }}/codeql-python

      - name: Analyze Python with CodeQL
        id: analyze-python
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:python
          output: ${{ runner.temp }}/python-codeql-sarif
          upload: always
          wait-for-processing: true

      - name: Verify Python source extraction
        env:
          CODEQL_CLI: ${{ steps.init-python.outputs.codeql-path }}
          CODEQL_DATABASES: ${{ steps.analyze-python.outputs.db-locations }}
          CODEQL_SARIF: ${{ steps.analyze-python.outputs.sarif-output }}
        run: |
          set -euo pipefail
          git ls-files -z -- '*.py' > "$RUNNER_TEMP/python-codeql-sources"
          "$CODEQL_CLI" bqrs decode --format=json --entities=string,url \
            "$RUNNER_TEMP/codeql-python/python/results/codeql/python-queries/Diagnostics/ExtractedFiles.bqrs" \
            > "$RUNNER_TEMP/python-codeql-extracted.json"
          python scripts/validate-codeql-python-coverage.py \
            --databases "$CODEQL_DATABASES" --sarif-directory "$CODEQL_SARIF" \
            --inventory "$RUNNER_TEMP/python-codeql-sources" \
            --extracted "$RUNNER_TEMP/python-codeql-extracted.json" \
            --head-sha "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/python-codeql-coverage.json"

      - name: Upload Python CodeQL evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-codeql-evidence
          path: |
            ${{ runner.temp }}/python-codeql-coverage.json
            ${{ runner.temp }}/python-codeql-extracted.json
            ${{ runner.temp }}/python-codeql-sarif/python.sarif
          if-no-files-found: error
          retention-days: 14
