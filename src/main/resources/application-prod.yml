# #############################################################################
# ENTERPRISE SHOP - PRODUCTION PROFILE CONFIGURATION
# Active Profile: prod
# Description: Hardened configuration for high-availability environments.
# #############################################################################

spring:
  # Persistence Layer: Production Database Connectivity
  # Credentials must be injected via secure environment variables.
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Per-replica capacity and acquisition bounds are deployment-owned and mandatory.
    hikari:
      maximum-pool-size: ${DATABASE_MAXIMUM_POOL_SIZE}
      minimum-idle: ${DATABASE_MINIMUM_IDLE}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MILLISECONDS}

  # JPA & Hibernate: Production Settings
  # 'validate' ensures that no destructive schema changes occur.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false # Prevents performance issues and DB connection leaking
    show-sql: false     # Disabled for performance and security (avoids logging sensitive data)
    properties:
      hibernate:
        # Optimization: enables batching for better performance
        jdbc.batch_size: 25

  # Database Migrations: Flyway
  # Migration credentials are mandatory and deliberately separate from the runtime datasource.
  flyway:
    enabled: true
    url: ${FLYWAY_URL:${DATABASE_URL}}
    user: ${FLYWAY_USER}
    password: ${FLYWAY_PASSWORD}
    baseline-on-migrate: false
    check-location: true

# Runtime API documentation is disabled at the production trust boundary.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  show-actuator: false

# This repository does not own a production reverse proxy or its trusted network path.
# Keep client/protocol forwarding metadata untrusted until that boundary is implemented.
server:
  forward-headers-strategy: none
  # Per-replica HTTP admission limits depend on deployment resources and are mandatory.
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT}
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT}

# Production traffic routing must use readiness, while liveness deliberately
# excludes shared dependencies to avoid restart loops during a database outage.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

# #############################################################################
# SECURITY: JWT CONFIGURATION
# Cryptographic settings for authentication.
# #############################################################################
security:
  jwt:
    # Active key ID is non-secret and must be stable for the lifetime of issued tokens.
    key-id: ${JWT_KEY_ID}
    # RFC 4648 Base64 encoding of at least 32 high-entropy random bytes.
    secret: ${JWT_SECRET}
    # Optional bounded rollover key; configure both values together or neither.
    previous-key-id: ${JWT_PREVIOUS_KEY_ID:}
    previous-secret: ${JWT_PREVIOUS_SECRET:}
    expiration: 3600000          # 1 hour
    refresh-expiration: 86400000 # Reserved; no refresh-token flow exists.

# #############################################################################
# INTEGRATIONS: STRIPE PAYMENT GATEWAY
# Production requires real credentials from environment or secret management.
# #############################################################################
stripe:
  api-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  public-key: ${STRIPE_PUBLIC_KEY}
  network:
    connect-timeout: ${STRIPE_CONNECT_TIMEOUT}
    read-timeout: ${STRIPE_READ_TIMEOUT}
    max-network-retries: ${STRIPE_MAX_NETWORK_RETRIES}

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  order:
    reservation-expiration:
      duration: ${ORDER_RESERVATION_DURATION:PT30M}
      fixed-delay: ${ORDER_RESERVATION_FIXED_DELAY:PT10S}
      retry-delay: ${ORDER_RESERVATION_RETRY_DELAY:PT1M}
      claim-lease: ${ORDER_RESERVATION_CLAIM_LEASE:PT5M}
      batch-size: ${ORDER_RESERVATION_BATCH_SIZE:25}
      max-attempts: ${ORDER_RESERVATION_MAX_ATTEMPTS:10}
  notification:
    smtp:
      enabled: ${NOTIFICATION_SMTP_ENABLED:false}
      from: ${NOTIFICATION_SMTP_FROM:no-reply@enterprise-shop.local}
      connection-timeout: ${NOTIFICATION_SMTP_CONNECTION_TIMEOUT:PT30S}
      read-timeout: ${NOTIFICATION_SMTP_READ_TIMEOUT:PT30S}
      write-timeout: ${NOTIFICATION_SMTP_WRITE_TIMEOUT:PT30S}

# #############################################################################
# OBSERVABILITY: PRODUCTION LOGGING
# Minimalistic logging to focus on system health and critical failures.
# #############################################################################
logging:
  level:
    root: WARN
    com.company.shop: INFO # Business logic events
