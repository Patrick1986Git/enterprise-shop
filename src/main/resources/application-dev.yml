# #############################################################################
# ENTERPRISE SHOP - DEVELOPMENT PROFILE CONFIGURATION
# Active Profile: dev
# Description: Configuration for local development environment using PostgreSQL.
# #############################################################################

spring:
  # Persistence Layer: PostgreSQL Connectivity
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/enterprise_shop_dev}
    username: ${DATABASE_USERNAME:${APP_DB_USER:shop_dev}}
    password: ${DATABASE_PASSWORD:${APP_DB_PASSWORD:shop_dev}}
    driver-class-name: org.postgresql.Driver

  # JPA & Hibernate: ORM Strategy
  # In Dev, we use 'validate' to ensure DB schema matches entities without altering data.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false # Disabled to avoid N+1 queries during view rendering
    show-sql: true      # Logs generated SQL to console for debugging
    properties:
      hibernate:
        format_sql: true

  # Database Migrations: Flyway
  # Ensures that the database schema is evolved version-by-version in a repeatable way.
  flyway:
    enabled: true
    url: ${FLYWAY_URL:${DATABASE_URL:jdbc:postgresql://localhost:5433/enterprise_shop_dev}}
    user: ${FLYWAY_USER:${POSTGRES_USER:postgres}}
    password: ${FLYWAY_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public

# #############################################################################
# SECURITY: JWT CONFIGURATION
# These settings control the issuance and verification of security tokens.
# #############################################################################
security:
  jwt:
    # Security Notice: 
    # JWT_SECRET is RFC 4648 Base64 encoding of at least 32 random bytes.
    # Local development only, never production, override with JWT_SECRET.
    secret: ${JWT_SECRET:ZGV2LW9ubHktand0LXNpZ25pbmcta2V5LTMyLWJ5dGVzISE=}
    
    # Token Lifespan Management
    expiration: 3600000          # Access Token: 1h (in milliseconds)
    refresh-expiration: 86400000 # Reserved; no refresh-token flow exists.

# #############################################################################
# INTEGRATIONS: STRIPE PAYMENT GATEWAY
# Local placeholders keep development startup convenient. Override via environment
# variables when testing with real Stripe credentials.
# #############################################################################
stripe:
  api-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  public-key: ${STRIPE_PUBLIC_KEY:pk_test_placeholder}

# #############################################################################
# OBSERVABILITY & LOGGING (Dev Specific)
# #############################################################################
logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
