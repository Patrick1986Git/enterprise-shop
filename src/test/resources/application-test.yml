    key-id: test-current
    secret: dGVzdC1vbmx5LTMyLWJ5dGUtand0LXNlY3JldC1rZXkh
    previous-key-id:
    previous-secret:
    expiration: 3600000
    refresh-expiration: 86400000

stripe:
  api-key: sk_test_placeholder
  webhook-secret: whsec_placeholder
  public-key: pk_test_placeholder
