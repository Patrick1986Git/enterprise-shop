spring:
  datasource:
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  test:
    database:
      replace: none

