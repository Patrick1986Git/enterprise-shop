services:
  postgres:
    build:
      context: ./docker/postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_shop_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - enterprise-shop-network
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  database-role-bootstrap:
    build:
      context: ./docker/postgres
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_shop_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_DB_USER: ${APP_DB_USER:-shop_dev}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-shop_dev}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/bootstrap/bootstrap-app-role.sh"]
    volumes:
      - ./scripts/bootstrap-app-role.sh:/bootstrap/bootstrap-app-role.sh:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - enterprise-shop-network
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-enterprise_shop_dev}
      DATABASE_USERNAME: ${APP_DB_USER:-shop_dev}
      DATABASE_PASSWORD: ${APP_DB_PASSWORD:-shop_dev}
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-enterprise_shop_dev}
      FLYWAY_USER: ${POSTGRES_USER:-postgres}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktand0LXNpZ25pbmcta2V5LTMyLWJ5dGVzISE=}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-pk_test_placeholder}
      APP_NOTIFICATION_SMTP_ENABLED: ${NOTIFICATION_SMTP_ENABLED:-false}
      APP_NOTIFICATION_SMTP_FROM: ${NOTIFICATION_SMTP_FROM:-no-reply@enterprise-shop.local}
      APP_NOTIFICATION_SMTP_CONNECTION_TIMEOUT: ${NOTIFICATION_SMTP_CONNECTION_TIMEOUT:-PT30S}
      APP_NOTIFICATION_SMTP_READ_TIMEOUT: ${NOTIFICATION_SMTP_READ_TIMEOUT:-PT30S}
      APP_NOTIFICATION_SMTP_WRITE_TIMEOUT: ${NOTIFICATION_SMTP_WRITE_TIMEOUT:-PT30S}
    depends_on:
      postgres:
        condition: service_healthy
      database-role-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    networks:
      - enterprise-shop-network
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  enterprise-shop-network:
    driver: bridge

volumes:
  postgres_data:
    name: enterprise_shop_postgres18_volume
